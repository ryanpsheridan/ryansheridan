<style>
  /* ===== BRAND COLORS: the only place colors are defined. Update here on rebrand. ===== */
  :host, .rad-stage {
    --black: #000000;
    --blue-700: #031033;
    --focus: #5492F7;
    --gray-100: #F2F4F7;
    --gray-200: #E4E7EC;
    --gray-600: #667085;
    --gray-800: #344054;
    --gray-900: #161C26;
    --lemon: #FFFCBD;
    --mist: #CFDCFF;
    --rose: #FDD1E7;
    --white: #FFFFFF;
    display: block;
    font-family: inherit;
  }
  /* ===== end brand colors ===== */

  /* Height: the component reads --embed-aspect-ratio (plain numbers) from here. Artwork is 530 x 522. */
  :host, .rad-stage { --embed-aspect-ratio: 530 / 522; aspect-ratio: var(--embed-aspect-ratio); }

  /* The art fits its box exactly, so the root may clip. The component's Corner radius rounds it. */
  .rad-stage { position: relative; margin: 0; background: var(--gray-900); border-radius: inherit; overflow: hidden; }
  .rad-art { display: block; width: 100%; height: 100%; }

  /* Real buttons laid over the art: pointer for mouse, touch and pen, arrow keys for keyboard. */
  .rad-btn {
    position: absolute; margin: 0; padding: 0; border: 0; background: transparent;
    appearance: none; -webkit-appearance: none; border-radius: 4px; touch-action: pan-y;
  }
  .rad-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  .rad-row { left: 14.906%; width: 70.189%; height: 10.728%; cursor: pointer; }
  .rad-row-0 { top: 46.169%; }
  .rad-row-1 { top: 56.897%; }
  .rad-row-2 { top: 67.625%; }

  /* Artwork colors, bound to the tokens above */
  .rad-f-black { fill: var(--black); }
  .rad-f-blue-700 { fill: var(--blue-700); }
  .rad-f-gray-100 { fill: var(--gray-100); }
  .rad-f-gray-200 { fill: var(--gray-200); }
  .rad-f-gray-600 { fill: var(--gray-600); }
  .rad-f-gray-900 { fill: var(--gray-900); }
  .rad-f-white { fill: var(--white); }
  .rad-s-gray-200 { stroke: var(--gray-200); }
  .rad-st-gray-800 { stop-color: var(--gray-800); }
  .rad-st-gray-900 { stop-color: var(--gray-900); }
  .rad-st-lemon { stop-color: var(--lemon); }
  .rad-st-mist { stop-color: var(--mist); }
  .rad-st-rose { stop-color: var(--rose); }
  .rad-st-white { stop-color: var(--white); }
</style>

      gsap.set([stage, ui], { clearProps: "all" });
    });
    addCleanup(function () {
      io.disconnect();
      entrance.kill();
      killers.forEach(function (k) { k(); });
    });
  })();
</script>

</body>
