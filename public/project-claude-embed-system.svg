<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Placeholder: How the two pieces fit"><style>.k{font:600 22px system-ui,sans-serif;letter-spacing:3px;fill:#8a8a8f}.t{font:500 44px system-ui,sans-serif;fill:#3a3a3d}.b{font:400 24px system-ui,sans-serif;fill:#6b6b70}text{text-anchor:middle}</style><rect width="1600" height="900" fill="#f2f2f3"/><rect x="16" y="16" width="1568" height="868" fill="none" stroke="#c4c4c8" stroke-width="3" stroke-dasharray="14 10" rx="8"/><text x="800" y="359" class="k">DIAGRAM</text><text x="800" y="409" class="t">How the two pieces fit</text><text x="800" y="469" class="b">A simple flow: Designer builds in Claude, then the skill fixes the asset,</text><text x="800" y="509" class="b">then it is pasted into the Claude Embed component, then the live page.</text><text x="800" y="549" class="b">Label the skill 'protects the brand' and the component 'protects the page'.</text></svg>
