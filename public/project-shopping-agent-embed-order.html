<style>
  /* ===== BRAND COLORS: the only place colors are defined. Update here on rebrand. ===== */
  :host, .rot-stage {
    --black: #000000;
    --blue-400: #2664FF;
    --blue-700: #031033;
    --focus: #5492F7;
    --gray-100: #F2F4F7;
    --gray-200: #E4E7EC;
    --gray-500: #8A94A7;
    --gray-600: #667085;
    --gray-800: #344054;
    --gray-900: #161C26;
    --lemon: #FFFCBD;
    --mist: #CFDCFF;
    --rose: #FDD1E7;
    --white: #FFFFFF;
    display: block;
    font-family: inherit;
  }
  /* ===== end brand colors ===== */

  /* Height: the component reads --embed-aspect-ratio (plain numbers) from here. Artwork is 530 x 522. */
  :host, .rot-stage { --embed-aspect-ratio: 530 / 522; aspect-ratio: var(--embed-aspect-ratio); }

  /* The art fits its box exactly, so the root may clip. The component's Corner radius rounds it. */
  .rot-stage { position: relative; margin: 0; background: var(--gray-900); border-radius: inherit; overflow: hidden; }
  .rot-art { display: block; width: 100%; height: 100%; }

  /* Real buttons laid over the art: pointer for mouse, touch and pen, arrow keys for keyboard. */
  .rot-btn {
    position: absolute; margin: 0; padding: 0; border: 0; background: transparent;
    appearance: none; -webkit-appearance: none; border-radius: 4px; touch-action: pan-y;
  }
  .rot-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  .rot-hit { inset: 0; width: 100%; height: 100%; cursor: ew-resize; }

  /* Artwork colors, bound to the tokens above */
  .rot-f-black { fill: var(--black); }
  .rot-f-blue-400 { fill: var(--blue-400); }
  .rot-f-blue-700 { fill: var(--blue-700); }
  .rot-f-gray-100 { fill: var(--gray-100); }
  .rot-f-gray-500 { fill: var(--gray-500); }
  .rot-f-gray-600 { fill: var(--gray-600); }
  .rot-f-gray-800 { fill: var(--gray-800); }
  .rot-f-gray-900 { fill: var(--gray-900); }
  .rot-f-white { fill: var(--white); }
  .rot-s-blue-400 { stroke: var(--blue-400); }
  .rot-s-gray-200 { stroke: var(--gray-200); }
  .rot-s-gray-500 { stroke: var(--gray-500); }
  .rot-s-gray-900 { stroke: var(--gray-900); }
  .rot-s-white { stroke: var(--white); }
  .rot-st-gray-800 { stop-color: var(--gray-800); }
  .rot-st-gray-900 { stop-color: var(--gray-900); }
  .rot-st-lemon { stop-color: var(--lemon); }
  .rot-st-mist { stop-color: var(--mist); }
  .rot-st-rose { stop-color: var(--rose); }
</style>
