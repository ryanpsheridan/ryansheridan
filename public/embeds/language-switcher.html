<style>
  /* ===== BRAND COLORS (BC): the only place colors are defined. Update here on rebrand. ===== */
  :host, .loc-stage {
    --loc-white: #FFFFFF;   /* BC White */
    --loc-black: #000000;   /* BC Black */
    --loc-mist: #CFDCFF;    /* BC Mist */
    --loc-rose: #FDD1E7;    /* BC Rose */
    --loc-lemon: #FFFCBD;   /* BC Lemon */
    --loc-hover: rgba(255, 255, 255, 0.28);  /* BC White at 28%: language cell hover */
    --loc-focus: #5492F7;   /* BC Border / Focus */
    --loc-heart: #EA5656;   /* BC Border / Error: the liked heart */
    /* Mock storefront colors: they draw a merchant's store (cream card, maroon button), not Commerce UI,
       so they are deliberately not BC tokens. */
    --loc-ink: #131313;
    --loc-dim: #575757;
    --loc-maroon: #5F3535;
    --loc-cream: #FEFAF5;
    --loc-star: #D1AC98;
    --loc-line: #EEEEEE;
    display: block;
    font-family: inherit;
  }
  /* ===== end brand colors ===== */

  /* Height: the component reads --embed-aspect-ratio from here (artwork viewBox is 364 x 420). */
  :host, .loc-stage { --embed-aspect-ratio: 364 / 420; aspect-ratio: var(--embed-aspect-ratio); }

  .loc-stage { position: relative; margin: 0; overflow: hidden; border-radius: inherit; }
  .loc-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  .loc-glass { width: 100%; height: 100%; backdrop-filter: blur(6px); }

  .loc-f-white { fill: var(--loc-white); }
  .loc-f-black { fill: var(--loc-black); }
  .loc-f-ink { fill: var(--loc-ink); }
  .loc-f-dim { fill: var(--loc-dim); }
  .loc-f-maroon { fill: var(--loc-maroon); }
  .loc-f-cream { fill: var(--loc-cream); }
  .loc-f-star { fill: var(--loc-star); }
  .loc-s-black { stroke: var(--loc-black); }
  .loc-s-ink { stroke: var(--loc-ink); }
  .loc-s-star { stroke: var(--loc-star); }
  .loc-s-line { stroke: var(--loc-line); }
  .loc-s-lemon { stroke: var(--loc-lemon); }
  .loc-s-white { stroke: var(--loc-white); }
  .loc-st-lemon { stop-color: var(--loc-lemon); }
  .loc-st-mist { stop-color: var(--loc-mist); }
  .loc-st-rose { stop-color: var(--loc-rose); }

  /* Live text for the English and Dutch versions of the card (Italian stays as the outlined artwork). */
  .loc-t-name { font-family: inherit; font-size: 13.5px; fill: var(--loc-ink); }
  .loc-t-stock { font-family: inherit; font-size: 8px; fill: var(--loc-maroon); }
  .loc-t-cta { font-family: inherit; font-size: 8.3px; fill: var(--loc-white); text-anchor: middle; }

  /* Language buttons, added by the script, sitting over the EN, IT and NL cells. */
  .loc-controls { position: absolute; left: 34.34%; top: 6.19%; width: 31.32%; height: 9.05%;
    display: grid; grid-template-columns: repeat(3, 1fr); }
  .loc-btn { position: relative; margin: 0; padding: 0; border: 0; background: none; cursor: pointer;
    -webkit-tap-highlight-color: transparent; }
  .loc-btn:first-child { border-radius: 10.5% 0 0 10.5% / 10.5% 0 0 10.5%; }
  .loc-btn:last-child { border-radius: 0 10.5% 10.5% 0 / 0 10.5% 10.5% 0; }
  .loc-btn:hover { background: var(--loc-hover); }
  .loc-btn:focus-visible { outline: 2px solid var(--loc-focus); outline-offset: 1px; z-index: 1; }
  /* Taller touch area than the cell itself. */
  .loc-btn::after { content: ""; position: absolute; top: -4px; bottom: -4px; left: 0; right: 0; }

  /* Heart: a real button over the artwork's heart, big enough to tap. */
  .loc-heart { position: absolute; left: 74.25%; top: 28.1%; width: 44px; height: 44px; margin: 0; padding: 0; border: 0;
    background: none; border-radius: 50%; cursor: pointer; transform: translate(-50%, -50%); -webkit-tap-highlight-color: transparent; }
  .loc-heart:focus-visible { outline: 2px solid var(--loc-focus); outline-offset: -6px; }
  .loc-heart-path { transition: fill .2s linear, stroke .2s linear; }
  .loc-liked .loc-heart-path { fill: var(--loc-heart); stroke: var(--loc-heart); }
</style>

    on(stage, "pointerleave", function (e) { if (e.pointerType === "mouse") { growPill(false); } });
    on(stage, "focusin", function () { growPill(true); });
    on(stage, "focusout", function () { growPill(false); });
    on(stage, "pointerdown", function (e) {
      if (e.pointerType === "mouse") { return; }
      growPill(true);
      if (touchTimer) { touchTimer.kill(); }
      touchTimer = gsap.delayedCall(1.2, function () { growPill(false); });
    });

    var buttons = {};
    function setLang(next) {
      if (next === cur) { return; }
      var prev = cur;
      cur = next;
      gsap.to(hl, { x: cellX[next] - 125, duration: 0.7, ease: "power2.inOut", overwrite: "auto" });
      gsap.to(blk[prev], { opacity: 0, duration: 0.3, ease: "sine.inOut", overwrite: "auto" });
      gsap.to(blk[next], { opacity: 1, duration: 0.35, delay: 0.3, ease: "sine.inOut", overwrite: "auto" });
      var j = 0;
      while (j !== fields.length) {
        gsap.to(fields[j].els[prev], { opacity: 0, duration: 0.3, ease: "sine.inOut", overwrite: "auto" });
        gsap.to(fields[j].els[next], { opacity: 1, duration: 0.45, delay: 0.25, ease: "sine.inOut", overwrite: "auto" });
        j = j + 1;
      }
      j = 0;
      while (j !== order.length) {

        j = j + 1;
      }

    // Arrival: it starts on English, glides to Italian, then Dutch, and lands back on English (about 5s), and rests.
    var seq = ["it", "nl", "en"];
    var FIRST = 0.9;       // seconds English stays up before the first change
    var STEP = 1.6;        // seconds each language stays up after that
    var step = 0;
    var timer = null;
    var played = false;
    var finished = false;
    var stopped = false;
    function next() {
      if (stopped) { return; }
      setLang(seq[step]);
      step = step + 1;
      if (step === seq.length) { finished = true; } else { timer = gsap.delayedCall(STEP, next); }
    }
    function play() {
      if (stopped || played) { return; }
      played = true;
      timer = gsap.delayedCall(FIRST, next);
    }
    function stopIdle() {
      if (stopped) { return; }
      stopped = true;
      leave();
      if (timer) { timer.kill(); }
    }

    // Real buttons over the EN, IT and NL cells: mouse, touch and keyboard all switch the language.
    var wrap = document.createElement("div");
    wrap.className = "loc-controls";
    wrap.setAttribute("role", "group");
    wrap.setAttribute("aria-label", "Language");
    k = 0;
    while (k !== order.length) {
      bindButton(order[k]);
      k = k + 1;
    }
    function bindButton(code) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "loc-btn";
      b.setAttribute("aria-label", names[code]);
      b.setAttribute("aria-pressed", code === cur ? "true" : "false");
      wrap.appendChild(b);
      buttons[code] = b;
      on(b, "click", function () { stopIdle(); setLang(code); });
    }
    stage.appendChild(wrap);

    function showRing(show) {
      gsap.to(ring, { opacity: show ? 1 : 0, duration: 0.25, overwrite: "auto" });
    }
    on(wrap, "pointerenter", function (e) { if (e.pointerType === "mouse") { stopIdle(); showRing(true); } });
    on(wrap, "pointerleave", function (e) { if (e.pointerType === "mouse") { showRing(false); } });
    on(wrap, "focusin", function () { stopIdle(); showRing(true); });
    on(wrap, "focusout", function () { showRing(false); });
    on(wrap, "pointerdown", function () { stopIdle(); });

    // Wait for this embed's turn in the row, then play once. Off screen it holds still.
    var io = new IntersectionObserver(function (entries) {
      if (stopped) { return; }
      var inView = Math.min(entries[0].intersectionRatio, 0.25) === 0.25;
      if (!played) {
        if (inView && ATTRACT) { arrive(play); } else { leave(); }
        return;
      }
      if (finished || !timer) { return; }
      if (inView) { timer.play(); } else { timer.pause(); }
    }, { threshold: [0, 0.25] });
    io.observe(anchor || stage);

    addCleanup(function () {
      io.disconnect();
      leave();
      fam.seen[SLOT] = 0;
      if (timer) { timer.kill(); }
      if (touchTimer) { touchTimer.kill(); }
      gsap.killTweensOf([hl, ring, pill, blk.it, blk.en, blk.nl]);
      if (heartArt) { gsap.killTweensOf(heartArt); }
      var j = 0;
      while (j !== fields.length) {
        gsap.killTweensOf([fields[j].els.it, fields[j].els.en, fields[j].els.nl]);
        j = j + 1;
      }
    });
  })();

</script>
