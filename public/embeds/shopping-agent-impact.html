<style>
  /* ===== BRAND COLORS: the only place colors are defined. Update here on rebrand. ===== */
  :host, .rim-stage {
    --black: #000000;
    --citron: #D3CA08;
    --gray-300: #D0D5DD;
    --gray-500: #8A94A7;
    --gray-800: #344054;
    --gray-900: #161C26;
    --lilac: #E9C9FF;
    --white: #FFFFFF;
    display: block;
    font-family: inherit;
  }
  /* ===== end brand colors ===== */

  /* Height: the component reads --embed-aspect-ratio (plain numbers) from here. Artwork is 530 x 522. */
  :host, .rim-stage { --embed-aspect-ratio: 530 / 522; aspect-ratio: var(--embed-aspect-ratio); }

  /* The art fits its box exactly, so the root may clip. The component's Corner radius rounds it. */
  .rim-stage { position: relative; margin: 0; background: var(--gray-900); border-radius: inherit; overflow: hidden; }
  .rim-art { display: block; width: 100%; height: 100%; }

  /* Artwork colors, bound to the tokens above */
  .rim-f-black { fill: var(--black); }
  .rim-f-gray-300 { fill: var(--gray-300); }
  .rim-f-gray-800 { fill: var(--gray-800); }
  .rim-f-white { fill: var(--white); }
  .rim-st-citron { stop-color: var(--citron); }
  .rim-st-gray-500 { stop-color: var(--gray-500); }
  .rim-st-gray-900 { stop-color: var(--gray-900); }
  .rim-st-lilac { stop-color: var(--lilac); }
  .rim-st-white { stop-color: var(--white); }
</style>

<script>
  // Works in Shadow Embed (root, host, onCleanup, listen, gsap supplied by the wrapper)
  // and in a plain page such as Claude's preview (none of those exist: show the finished state).
  (function () {
    var scope = typeof root !== "undefined" ? root : document;
    var anchor = typeof host !== "undefined" ? host : null;
    // A tab reveals some embeds instead of scrolling: their tile shows at once, without the fade.
    var fadeIn = !(anchor && anchor.hasAttribute("data-no-fade"));
    var addCleanup = typeof onCleanup === "function" ? onCleanup : function () {};
    var on = typeof listen === "function" ? listen : function (target, type, handler, opts) {
      target.addEventListener(type, handler, opts);
    };

    var stage = scope.querySelector(".rim-stage");
    var ui = scope.querySelector(".rim-ui");
    if (!stage || !ui || typeof gsap === "undefined") { return; } // no GSAP (preview): finished state
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
    if (reduce.matches) { return; }

    var bars = scope.querySelectorAll(".rim-bar");
    var nums = scope.querySelectorAll(".rim-num");
    var cards = scope.querySelectorAll(".rim-card");
    if (bars.length !== 2 || nums.length !== 2 || cards.length !== 3) { return; }

    // Shared timing block: identical in all four river embeds so they move as one family.
    var T = { fade: 0.7, rise: 0.9, lift: 18, delay: 0.1, ease: "power2.out" };

    // Entrance: the tile fades in and the glass UI floats up into it. Start states live here, not in the CSS.
    if (fadeIn) { gsap.set(stage, { opacity: 0 }); }
    gsap.set(ui, { y: T.lift });
    var entrance = gsap.timeline({ paused: true });
    if (fadeIn) { entrance.to(stage, { opacity: 1, duration: T.fade, ease: "power1.out" }, 0); }
    entrance.to(ui, { y: 0, duration: T.rise, ease: T.ease }, T.delay);

    // Then the two bars grow up from the baseline and their figures land, while the metric cards slide in.
    gsap.set(bars, { transformOrigin: "50% 100%", scaleY: 0 });
    gsap.set(nums, { opacity: 0, y: 6 });
    gsap.set(cards, { opacity: 0, x: 24 });
    entrance.to(bars, { scaleY: 1, duration: 0.9, ease: "power3.out", stagger: 0.15 }, 0.5);
    entrance.to(nums, { opacity: 1, y: 0, duration: 0.4, ease: "power1.out", stagger: 0.15 }, 1.05);
    entrance.to(cards, { opacity: 1, x: 0, duration: 0.6, ease: T.ease, stagger: 0.12 }, 0.6);

    // Play once, when the embed is a quarter on screen. Hold still while it is scrolled away mid-play.
    var io = new IntersectionObserver(function (entries) {
      if (entries[0].isIntersecting) { entrance.play(); } else { entrance.pause(); }
    }, { threshold: 0.25 });
    io.observe(anchor || stage);
    entrance.eventCallback("onComplete", function () { io.disconnect(); });

    // Reduced motion switched on later: jump to the finished state.
    on(reduce, "change", function () {
      if (!reduce.matches) { return; }
      io.disconnect();
      entrance.progress(1).kill();
    });
    addCleanup(function () {
      io.disconnect();
      entrance.kill();
    });
  })();
</script>
