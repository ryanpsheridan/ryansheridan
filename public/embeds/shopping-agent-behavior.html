<style>
  /* ===== BRAND COLORS: the only place colors are defined. Update here on rebrand. ===== */
  :host, .rbh-stage {
    --black: #000000;
    --blue-300: #86A8FF;
    --blue-400: #2664FF;
    --gray-300: #D0D5DD;
    --gray-500: #8A94A7;
    --gray-900: #161C26;
    --white: #FFFFFF;
    display: block;
    font-family: inherit;
  }
  /* ===== end brand colors ===== */

  /* Height: the component reads --embed-aspect-ratio (plain numbers) from here. Artwork is 530 x 522. */
  :host, .rbh-stage { --embed-aspect-ratio: 530 / 522; aspect-ratio: var(--embed-aspect-ratio); }

  /* The art fits its box exactly, so the root may clip. The component's Corner radius rounds it. */
  .rbh-stage { position: relative; margin: 0; background: var(--gray-900); border-radius: inherit; overflow: hidden; }
  .rbh-art { display: block; width: 100%; height: 100%; }

  /* Artwork colors, bound to the tokens above */
  .rbh-f-black { fill: var(--black); }
  .rbh-f-blue-300 { fill: var(--blue-300); }
  .rbh-f-blue-400 { fill: var(--blue-400); }
  .rbh-f-gray-300 { fill: var(--gray-300); }
  .rbh-f-gray-500 { fill: var(--gray-500); }
  .rbh-f-white { fill: var(--white); }
  .rbh-s-gray-300 { stroke: var(--gray-300); }
  .rbh-st-gray-500 { stop-color: var(--gray-500); }
  .rbh-st-gray-900 { stop-color: var(--gray-900); }
</style>

    // Entrance: the tile fades in and the glass UI floats up into it. Start states live here, not in the CSS.
    if (fadeIn) { gsap.set(stage, { opacity: 0 }); }
    gsap.set(ui, { y: T.lift });
    var entrance = gsap.timeline({ paused: true });
    if (fadeIn) { entrance.to(stage, { opacity: 1, duration: T.fade, ease: "power1.out" }, 0); }
    entrance.to(ui, { y: 0, duration: T.rise, ease: T.ease }, T.delay);

    // Then the switches flip on, top to bottom, and stay on.
    var i = 0;
    while (i !== toggles.length) {
      var t = toggles[i];
      var track = t.querySelector(".rbh-track");
      var knob = t.querySelector(".rbh-knob");
      var dot = t.querySelector(".rbh-dot");
      gsap.set([track, dot], { opacity: 0 });
      gsap.set(knob, { x: -12 });
      var at = 0.55 + 0.12 * i;
      entrance.to(knob, { x: 0, duration: 0.4, ease: "power3.out" }, at);
      entrance.to([track, dot], { opacity: 1, duration: 0.3, ease: "power1.out" }, at + 0.05);
      i = i + 1;
    }

    // Play once, when a tenth of the embed is on screen. Hold still while it is scrolled away mid-play.
    var io = new IntersectionObserver(function (entries) {
      if (entries[0].isIntersecting) { entrance.play(); } else { entrance.pause(); }
    }, { threshold: 0.1 });
    io.observe(anchor || stage);
    entrance.eventCallback("onComplete", function () { io.disconnect(); });

    // Reduced motion switched on later: jump to the finished state.
    on(reduce, "change", function () {
      if (!reduce.matches) { return; }
      io.disconnect();
      entrance.progress(1).kill();
    });
    addCleanup(function () {
      io.disconnect();
      entrance.kill();
    });
  })();
</script>
