<style>
  /* ===== BRAND COLORS: the only place colors are defined. Update here on rebrand. ===== */
  :host, .rpc-stage {
    --black: #000000;
    --blue-400: #2664FF;
    --focus: #5492F7;
    --gray-100: #F2F4F7;
    --gray-200: #E4E7EC;
    --gray-600: #667085;
    --gray-800: #344054;
    --gray-900: #161C26;
    --mist: #CFDCFF;
    --white: #FFFFFF;
    display: block;
    font-family: inherit;
  }
  /* ===== end brand colors ===== */

  /* Height: the component reads --embed-aspect-ratio (plain numbers) from here. Artwork is 530 x 522. */
  :host, .rpc-stage { --embed-aspect-ratio: 530 / 522; aspect-ratio: var(--embed-aspect-ratio); }

  /* The art fits its box exactly, so the root may clip. The component's Corner radius rounds it. */
  .rpc-stage { position: relative; margin: 0; background: var(--gray-900); border-radius: inherit; overflow: hidden; }
  .rpc-art { display: block; width: 100%; height: 100%; }

  /* Real buttons laid over the art: pointer for mouse, touch and pen, arrow keys for keyboard. */
  .rpc-btn {
    position: absolute; margin: 0; padding: 0; border: 0; background: transparent;
    appearance: none; -webkit-appearance: none; border-radius: 4px; touch-action: pan-y;
  }
  .rpc-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  .rpc-grab { top: 43.487%; width: 37.736%; height: 53.831%; cursor: grab; }
  .rpc-grab:active { cursor: grabbing; }
  .rpc-grab-0 { left: 12.453%; }
  .rpc-grab-1 { left: 52.453%; }
  .rpc-grab-2 { left: 92.453%; }
  .rpc-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* Artwork colors, bound to the tokens above */
  .rpc-f-black { fill: var(--black); }
  .rpc-f-blue-400 { fill: var(--blue-400); }
  .rpc-f-gray-100 { fill: var(--gray-100); }
  .rpc-f-gray-600 { fill: var(--gray-600); }
  .rpc-f-gray-800 { fill: var(--gray-800); }
  .rpc-f-gray-900 { fill: var(--gray-900); }
  .rpc-f-mist { fill: var(--mist); }
  .rpc-f-white { fill: var(--white); }
  .rpc-s-gray-200 { stroke: var(--gray-200); }
  .rpc-s-white { stroke: var(--white); }
  .rpc-st-gray-800 { stop-color: var(--gray-800); }
  .rpc-st-gray-900 { stop-color: var(--gray-900); }
</style>

  <button type="button" class="rpc-btn rpc-grab rpc-grab-1" aria-label="Eclipse Polarized Square Frame Sunglasses, position 2 of 3. Drag, or use the left and right arrow keys, to reorder."></button>
  <button type="button" class="rpc-btn rpc-grab rpc-grab-2" aria-label="Halo Polarized Square Frame Sunglasses, position 3 of 3. Drag, or use the left and right arrow keys, to reorder."></button>

</figure>

<script>
  // Works in Shadow Embed (root, host, onCleanup, listen, gsap supplied by the wrapper)
  // and in a plain page such as Claude's preview (none of those exist: show the finished state).
  (function () {
    var scope = typeof root !== "undefined" ? root : document;
    var anchor = typeof host !== "undefined" ? host : null;
    var addCleanup = typeof onCleanup === "function" ? onCleanup : function () {};
    var on = typeof listen === "function" ? listen : function (target, type, handler, opts) {
      target.addEventListener(type, handler, opts);
    };

    var stage = scope.querySelector(".rpc-stage");
    var ui = scope.querySelector(".rpc-ui");
    if (!stage || !ui || typeof gsap === "undefined") { return; } // no GSAP (preview): finished state
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
    if (reduce.matches) { return; }

    var svg = scope.querySelector(".rpc-art");
    var live = scope.querySelector(".rpc-sr");
    var cardEls = scope.querySelectorAll(".rpc-card");
    var btns = scope.querySelectorAll(".rpc-grab");
    if (!svg || !live || cardEls.length !== 3 || btns.length !== 3) { return; }

    // Shared timing block: identical in all four river embeds so they move as one family.
    var T = { fade: 0.7, rise: 0.9, lift: 18, delay: 0.1, ease: "power2.out" };
    var settlers = []; // each puts its piece back in the finished state
    var killers = [];  // each stops its own tweens

    // Entrance: the tile fades in and the glass UI floats up into it. Start states live here, not in the CSS.
    gsap.set(stage, { opacity: 0 });
    gsap.set(ui, { y: T.lift });
    var entrance = gsap.timeline({ paused: true });
    entrance.to(stage, { opacity: 1, duration: T.fade, ease: "power1.out" }, 0);
    entrance.to(ui, { y: 0, duration: T.rise, ease: T.ease }, T.delay);

    // Hover (mouse) lifts a card to show it can be moved. Drag it, or use the arrow keys, and the others make room.
    var PITCH = 212;   // distance between card slots, in artwork units
    var CARD_W = 200;  // button width, in artwork units
    var VIEW_W = 530;  // artwork width
    var LAST = 2;      // index of the last slot
    var GROW = 1.03;
    var NAMES = [
      "Daybreak Polarized Mirrored Square Frame Sunglasses",
      "Eclipse Polarized Square Frame Sunglasses",
      "Halo Polarized Square Frame Sunglasses"
    ];
    var cards = [];
    var c0 = 0;
    while (c0 !== 3) {
      cards.push({ el: cardEls[c0], btn: btns[c0], natural: c0, slot: c0, name: NAMES[c0], dragging: false, hover: false, pointer: -1, startX: 0, startPos: 0, target: c0 });
      c0 = c0 + 1;
    }
    gsap.set(cardEls, { transformOrigin: "50% 50%" });

    // x is the card's position measured from slot 0, in artwork units.
    function place(c, x, grown, fast) {
      var tx = x - c.natural * PITCH;
      var d = fast ? 0.12 : 0.5;
      gsap.to(c.el, { x: tx, scale: grown ? GROW : 1, duration: d, ease: "power3.out", overwrite: "auto" });
      gsap.to(c.btn, { xPercent: tx / CARD_W * 100, duration: d, ease: "power3.out", overwrite: "auto" });
    }
    function describe() {
      cards.forEach(function (c) {
        c.btn.setAttribute("aria-label", c.name + ", position " + (c.slot + 1) + " of 3. Drag, or use the left and right arrow keys, to reorder.");
      });
    }
    function toFront(c) { c.el.parentNode.appendChild(c.el); }

    // Put the grabbed card at index "target"; every other card shifts to fill the gaps.
    function relayout(c, target) {
      var others = cards.filter(function (o) { return o !== c; }).sort(function (p, q) { return p.slot - q.slot; });
      others.splice(target, 0, c);
      others.forEach(function (o, i) {
        if (o === c || o.slot === i) { return; }
        o.slot = i;
        place(o, i * PITCH, o.hover, false);
      });
    }
    function begin(c, e) {
      c.dragging = true;
      c.pointer = e.pointerId;
      c.startX = e.clientX;
      c.startPos = c.slot * PITCH;
      c.target = c.slot;
      toFront(c);
      c.btn.setPointerCapture(e.pointerId);
      place(c, c.startPos, true, true);
    }
    function drag(c, e) {
      if (!c.dragging || e.pointerId !== c.pointer) { return; }
      var scale = VIEW_W / svg.getBoundingClientRect().width;
      var x = Math.max(0, Math.min(LAST * PITCH, c.startPos + (e.clientX - c.startX) * scale));
      place(c, x, true, true);
      var target = Math.round(x / PITCH);
      if (target !== c.target) {
        c.target = target;
        relayout(c, target);
      }
    }
    function drop(c, e) {
      if (!c.dragging || e.pointerId !== c.pointer) { return; }
      c.dragging = false;
      var before = c.slot;
      c.slot = c.target;
      place(c, c.slot * PITCH, c.hover, false);
      describe();
      if (before !== c.slot) { live.textContent = c.name + " moved to position " + (c.slot + 1) + " of 3"; }
    }
    function key(c, e) {
      var step = e.key === "ArrowLeft" ? -1 : (e.key === "ArrowRight" ? 1 : 0);
      if (step === 0) { return; }
      e.preventDefault();
      var slot = Math.max(0, Math.min(LAST, c.slot + step));
      if (slot === c.slot) { return; }
      toFront(c);
      relayout(c, slot);
      c.slot = slot;
      c.target = slot;
      place(c, slot * PITCH, true, false);
      describe();
      live.textContent = c.name + " moved to position " + (slot + 1) + " of 3";
    }
    cards.forEach(function (c) {
      on(c.btn, "pointerenter", function (e) {
        if (e.pointerType !== "mouse") { return; }
        c.hover = true;
        if (!c.dragging) { place(c, c.slot * PITCH, true, false); }
      });
      on(c.btn, "pointerleave", function () {
        c.hover = false;
        if (!c.dragging) { place(c, c.slot * PITCH, false, false); }
      });
      on(c.btn, "pointerdown", function (e) { begin(c, e); });
      on(c.btn, "pointermove", function (e) { drag(c, e); });
      on(c.btn, "pointerup", function (e) { drop(c, e); });
      on(c.btn, "pointercancel", function (e) { drop(c, e); });
      on(c.btn, "keydown", function (e) { key(c, e); });
      on(c.btn, "focus", function () { if (c.btn.matches(":focus-visible")) { place(c, c.slot * PITCH, true, false); } });
      on(c.btn, "blur", function () { if (!c.dragging) { place(c, c.slot * PITCH, false, false); } });
    });
    killers.push(function () { gsap.killTweensOf([cardEls, btns]); });
    settlers.push(function () { gsap.set([cardEls, btns], { clearProps: "all" }); });

    // Play the entrance once, when the embed is a quarter on screen.
    var seen = false;
    var io = new IntersectionObserver(function (entries) {
      if (entries[0].isIntersecting && !seen) { seen = true; entrance.play(); }
    }, { threshold: 0.25 });
    io.observe(anchor || stage);

    // Reduced motion switched on later: stop everything and show the finished state.
    on(reduce, "change", function () {
      if (!reduce.matches) { return; }
      entrance.kill();
      killers.forEach(function (k) { k(); });
      settlers.forEach(function (s) { s(); });
      gsap.set([stage, ui], { clearProps: "all" });
    });
    addCleanup(function () {
      io.disconnect();
      entrance.kill();
      killers.forEach(function (k) { k(); });
    });
  })();
</script>
