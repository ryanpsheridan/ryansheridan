<style>
  /* ===== BRAND COLORS: the only place colors are defined. Update here on rebrand. ===== */
  :host, .rsn-stage {
    --bar-negative: #BEC4D2;
    --bar-neutral: #969EB0;
    --black: #000000;
    --blue-700: #031033;
    --gray-500: #8A94A7;
    --gray-600: #667085;
    --gray-900: #161C26;
    --ink: #1F2937;
    --lemon: #FFFCBD;
    --line: #DDE2E9;
    --mist: #CFDCFF;
    --rose: #FDD1E7;
    --tag: #F3F4F7;
    --track: #E1E5EB;
    --white: #FFFFFF;
    display: block;
    font-family: inherit;
  }
  /* ===== end brand colors ===== */

  /* Height: the component reads --embed-aspect-ratio (plain numbers) from here. Artwork is 530 x 522. */
  :host, .rsn-stage { --embed-aspect-ratio: 530 / 522; aspect-ratio: var(--embed-aspect-ratio); }

  /* The art fits its box exactly, so the root may clip. The component's Corner radius rounds it. */
  .rsn-stage { position: relative; margin: 0; background: var(--gray-900); border-radius: inherit; overflow: hidden; }
  .rsn-art { display: block; width: 100%; height: 100%; }

  /* Artwork colors, bound to the tokens above */
  .rsn-f-bar-negative { fill: var(--bar-negative); }
  .rsn-f-bar-neutral { fill: var(--bar-neutral); }
  .rsn-f-black { fill: var(--black); }
  .rsn-f-blue-700 { fill: var(--blue-700); }
  .rsn-f-gray-500 { fill: var(--gray-500); }
  .rsn-f-gray-600 { fill: var(--gray-600); }
  .rsn-f-ink { fill: var(--ink); }
  .rsn-f-tag { fill: var(--tag); }
  .rsn-f-track { fill: var(--track); }
  .rsn-f-white { fill: var(--white); }
  .rsn-s-line { stroke: var(--line); }
  .rsn-st-gray-500 { stop-color: var(--gray-500); }
  .rsn-st-gray-900 { stop-color: var(--gray-900); }
  .rsn-st-lemon { stop-color: var(--lemon); }
  .rsn-st-mist { stop-color: var(--mist); }
  .rsn-st-rose { stop-color: var(--rose); }
  .rsn-st-white { stop-color: var(--white); }
</style>

<script>
  // Works in Shadow Embed (root, host, onCleanup, listen, gsap supplied by the wrapper)
  // and in a plain page such as Claude's preview (none of those exist: show the finished state).
  (function () {
    var scope = typeof root !== "undefined" ? root : document;
    var anchor = typeof host !== "undefined" ? host : null;
    var addCleanup = typeof onCleanup === "function" ? onCleanup : function () {};
    var on = typeof listen === "function" ? listen : function (target, type, handler, opts) {
      target.addEventListener(type, handler, opts);
    };

    var stage = scope.querySelector(".rsn-stage");
    var ui = scope.querySelector(".rsn-ui");
    if (!stage || !ui || typeof gsap === "undefined") { return; } // no GSAP (preview): finished state
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
    if (reduce.matches) { return; }

    var band = scope.querySelector(".rsn-band");
    var bars = scope.querySelectorAll(".rsn-bar");
    if (!band || bars.length !== 3) { return; }

    // Shared timing block: identical in all four river embeds so they move as one family.
    var T = { fade: 0.7, rise: 0.9, lift: 18, delay: 0.1, ease: "power2.out" };

    // Entrance: the tile fades in and the glass UI floats up into it. Start states live here, not in the CSS.
    gsap.set(stage, { opacity: 0 });
    gsap.set(ui, { y: T.lift });
    var entrance = gsap.timeline({ paused: true });
    entrance.to(stage, { opacity: 1, duration: T.fade, ease: "power1.out" }, 0);
    entrance.to(ui, { y: 0, duration: T.rise, ease: T.ease }, T.delay);

    // Then the bars fill one after another and the Positive row lights up.
    gsap.set(bars, { transformOrigin: "0% 50%", scaleX: 0 });
    gsap.set(band, { opacity: 0 });
    entrance.to(bars, { scaleX: 1, duration: 0.9, ease: "power3.out", stagger: 0.14 }, 0.5);
    entrance.to(band, { opacity: 1, duration: 0.6, ease: "power1.out" }, 1.1);

    // Play once, when the embed is a quarter on screen. Hold still while it is scrolled away mid-play.
    var io = new IntersectionObserver(function (entries) {
      if (entries[0].isIntersecting) { entrance.play(); } else { entrance.pause(); }
    }, { threshold: 0.25 });
    io.observe(anchor || stage);
    entrance.eventCallback("onComplete", function () { io.disconnect(); });

    // Reduced motion switched on later: jump to the finished state.
    on(reduce, "change", function () {
      if (!reduce.matches) { return; }
      io.disconnect();
      entrance.progress(1).kill();
    });
    addCleanup(function () {
      io.disconnect();
      entrance.kill();
    });
  })();
</script>
