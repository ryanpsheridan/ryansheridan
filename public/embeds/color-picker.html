<style>
  /* ===== BRAND COLORS: the only place colors are defined. Update here on rebrand. ===== */
  :host, .rbp-stage {
    --black: #000000;
    --focus: #5492F7;
    --gray-200: #E4E7EC;
    --gray-600: #667085;
    --gray-800: #344054;
    --gray-900: #161C26;
    --mist: #CFDCFF;
    --white: #FFFFFF;
    --hue-1: #FF0080; /* picker artwork, not a brand token */
    --hue-2: #3333FF; /* picker artwork, not a brand token */
    --hue-3: #00E699; /* picker artwork, not a brand token */
    --hue-4: #FF9900; /* picker artwork, not a brand token */
    --spectrum-deep: #0000E6; /* picker artwork, not a brand token */
    --spectrum-light: #D9D9FF; /* picker artwork, not a brand token */
    display: block;
    font-family: inherit;
  }
  /* ===== end brand colors ===== */

  /* Height: the component reads --embed-aspect-ratio (plain numbers) from here. Artwork is 530 x 522. */
  :host, .rbp-stage { --embed-aspect-ratio: 530 / 522; aspect-ratio: var(--embed-aspect-ratio); }

  /* The art fits its box exactly, so the root may clip. The component's Corner radius rounds it. */
  .rbp-stage { position: relative; margin: 0; background: var(--gray-900); border-radius: inherit; overflow: hidden; }
  .rbp-art { display: block; width: 100%; height: 100%; }

  /* Real buttons laid over the art: pointer for mouse, touch and pen, arrow keys for keyboard. */
  .rbp-btn {
    position: absolute; margin: 0; padding: 0; border: 0; background: transparent;
    appearance: none; -webkit-appearance: none; border-radius: 4px; touch-action: pan-y;
  }
  .rbp-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  .rbp-pad { inset: 0; width: 100%; height: 100%; cursor: crosshair; }

  /* Artwork colors, bound to the tokens above */
  .rbp-f-black { fill: var(--black); }
  .rbp-f-gray-600 { fill: var(--gray-600); }
  .rbp-f-gray-900 { fill: var(--gray-900); }
  .rbp-f-mist { fill: var(--mist); }
  .rbp-f-spectrum-deep { fill: var(--spectrum-deep); }
  .rbp-f-spectrum-light { fill: var(--spectrum-light); }
  .rbp-f-white { fill: var(--white); }
  .rbp-s-gray-200 { stroke: var(--gray-200); }
  .rbp-s-white { stroke: var(--white); }
  .rbp-st-black { stop-color: var(--black); }
  .rbp-st-gray-800 { stop-color: var(--gray-800); }
  .rbp-st-gray-900 { stop-color: var(--gray-900); }
  .rbp-st-hue-1 { stop-color: var(--hue-1); }
  .rbp-st-hue-2 { stop-color: var(--hue-2); }
  .rbp-st-hue-3 { stop-color: var(--hue-3); }
  .rbp-st-hue-4 { stop-color: var(--hue-4); }
  .rbp-st-spectrum-deep { stop-color: var(--spectrum-deep); }
  .rbp-st-spectrum-light { stop-color: var(--spectrum-light); }
</style>

    var fx = scope.querySelectorAll(".rbp-fx");
    var vals = scope.querySelector(".rbp-vals");
    var pad = scope.querySelector(".rbp-pad");
    if (!handle || !vals || !pad || fx.length !== 3) { return; }

    // Shared timing block: identical in all four river embeds so they move as one family.
    var T = { fade: 0.7, rise: 0.9, lift: 8, delay: 0.1, ease: "power2.out" };
    var settlers = []; // each puts its piece back in the finished state
    var killers = [];  // each stops its own tweens

    // Entrance: the tile fades in and the glass UI floats up into it. Start states live here, not in the CSS.
    gsap.set(stage, { opacity: 0 });
    gsap.set(ui, { y: T.lift });
    var entrance = gsap.timeline({ paused: true });
    entrance.to(stage, { opacity: 1, duration: T.fade, ease: "power1.out" }, 0);
    entrance.to(ui, { y: 0, duration: T.rise, ease: T.ease }, T.delay);

    // The handle moves like a magnet: it follows the pointer over the whole image, and sits right under it
    // when the pointer is on the picker itself. The swatch always shows the exact color under the handle.
    var HOME = { x: 345, y: 340.12 };
    var BOX = { x0: 284, x1: 468, y0: 257, y1: 359 };
    var FIELD = { x: 279, y: 252.12, w: 194, h: 112 };
    var POP = { x0: 269, y0: 242.12, x1: 483, y1: 455.12 };
    var REACH = 90;
    gsap.set(handle, { transformOrigin: "50% 50%" });
    var moveX = gsap.quickTo(handle, "x", { duration: 0.6, ease: "power3.out" });
    var moveY = gsap.quickTo(handle, "y", { duration: 0.6, ease: "power3.out" });
    var tint = [
      gsap.quickTo(fx[0], "opacity", { duration: 0.6, ease: "power2.out" }),
      gsap.quickTo(fx[1], "opacity", { duration: 0.6, ease: "power2.out" }),
      gsap.quickTo(fx[2], "opacity", { duration: 0.6, ease: "power2.out" })
    ];
    var dim = gsap.quickTo(vals, "opacity", { duration: 0.6, ease: "power2.out" });
    var kx = HOME.x;
    var ky = HOME.y;

    // Put the handle at (cx, cy) inside the field. Light layer, then deep blue by x, then black by y.
    function show(cx, cy) {
      moveX(cx - HOME.x);
      moveY(cy - HOME.y);
      tint[0](1);
      tint[1]((cx - FIELD.x) / FIELD.w);
      tint[2]((cy - FIELD.y) / FIELD.h);
      dim(0.55);
      kx = cx;
      ky = cy;
    }
    // ax, ay: the pointer in artwork units over the whole image.
    function follow(ax, ay) {
      var dx = Math.max(POP.x0 - ax, 0, ax - POP.x1);
      var dy = Math.max(POP.y0 - ay, 0, ay - POP.y1);
      var w = Math.max(0, 1 - Math.sqrt(dx * dx + dy * dy) / REACH);
      var magnetX = BOX.x0 + ax / 530 * (BOX.x1 - BOX.x0);
      var magnetY = BOX.y0 + ay / 522 * (BOX.y1 - BOX.y0);
      var directX = Math.max(BOX.x0, Math.min(BOX.x1, ax));
      var directY = Math.max(BOX.y0, Math.min(BOX.y1, ay));
      show(directX * w + magnetX * (1 - w), directY * w + magnetY * (1 - w));
    }
    function release() {
      moveX(0);
      moveY(0);
      tint[0](0);
      tint[1](0);
      tint[2](0);
      dim(1);
      kx = HOME.x;
      ky = HOME.y;
    }
    // A small pulse on the handle the moment the pointer arrives: this image can be played with.
    function cue() {
      gsap.fromTo(handle, { scale: 1 }, { scale: 1.7, duration: 0.22, yoyo: true, repeat: 1, ease: "power2.out", overwrite: false });
    }
    function atPointer(e) {
      var rect = pad.getBoundingClientRect();
      follow((e.clientX - rect.left) / rect.width * 530, (e.clientY - rect.top) / rect.height * 522);
    }
    on(pad, "pointerenter", function (e) { cue(); atPointer(e); });
    on(pad, "pointermove", atPointer);
    on(pad, "pointerdown", function (e) { if (e.pointerType !== "mouse") { cue(); } atPointer(e); });
    on(pad, "pointerleave", release);
    on(pad, "pointercancel", release);
    on(pad, "blur", release);
    on(pad, "keydown", function (e) {
      var dx = e.key === "ArrowLeft" ? -12 : (e.key === "ArrowRight" ? 12 : 0);
      var dy = e.key === "ArrowUp" ? -12 : (e.key === "ArrowDown" ? 12 : 0);
      if (e.key === "Escape") { release(); return; }
      if (dx === 0 && dy === 0) { return; }
      e.preventDefault();
      show(Math.max(BOX.x0, Math.min(BOX.x1, kx + dx)), Math.max(BOX.y0, Math.min(BOX.y1, ky + dy)));
    });
    killers.push(function () { gsap.killTweensOf([handle, fx, vals]); });
    settlers.push(function () { gsap.set([handle, fx, vals], { clearProps: "all" }); });

    // Play the entrance once, when the embed is a quarter on screen.
    var seen = false;
    var io = new IntersectionObserver(function (entries) {
      if (entries[0].isIntersecting && !seen) { seen = true; entrance.play(); }
    }, { threshold: 0.25 });
    io.observe(anchor || stage);

    // Reduced motion switched on later: stop everything and show the finished state.
    on(reduce, "change", function () {
      if (!reduce.matches) { return; }
      entrance.kill();
      killers.forEach(function (k) { k(); });
      settlers.forEach(function (s) { s(); });
      gsap.set([stage, ui], { clearProps: "all" });
    });
    addCleanup(function () {
      io.disconnect();
      entrance.kill();
      killers.forEach(function (k) { k(); });
    });
  })();
</script>
