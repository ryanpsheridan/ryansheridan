<text x="414" y="243" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#4A5160" text-anchor="start" dominant-baseline="central">Commerce Multi-brand Design System</text>
<text x="414" y="279" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" font-size="31" font-weight="600" fill="#101828" text-anchor="start" dominant-baseline="central" letter-spacing="-0.4">Library Updates</text>
<line x1="380" y1="350.5" x2="1220" y2="350.5" stroke="#DCDAD4" stroke-width="1"/>
<text x="414" y="400" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16.5" font-weight="600" fill="#101828" text-anchor="start" dominant-baseline="central">Applying text styles</text>
<text x="414" y="450" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#2A3240" text-anchor="start" dominant-baseline="central">This file uses a single shared set of text styles driven by brand tokens. Unlike previous brand files where each brand had its</text>
<text x="414" y="470" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#2A3240" text-anchor="start" dominant-baseline="central">own separate text styles, all Display, Heading, Type, and Bullet styles now live in one file, and they update automatically</text>
<text x="414" y="490" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#2A3240" text-anchor="start" dominant-baseline="central">based on the Brand mode applied to the parent frame.</text>
<text x="430" y="536.0" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#4A5160" text-anchor="end" dominant-baseline="central">1.</text>
<text x="437" y="536.0" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#2A3240" text-anchor="start" dominant-baseline="central">Set the Brand mode on your parent frame (CMRC, BIGC, or FDX)</text>
<text x="430" y="558.5" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#4A5160" text-anchor="end" dominant-baseline="central">2.</text>
<text x="437" y="558.5" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#2A3240" text-anchor="start" dominant-baseline="central">Apply any shared text style, typography will reflect the correct brand automatically</text>
<text x="430" y="581.0" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#4A5160" text-anchor="end" dominant-baseline="central">3.</text>
<text x="437" y="581.0" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#2A3240" text-anchor="start" dominant-baseline="central">For type color, select directly from Brand or primitive tokens in the color picker</text>
<text x="430" y="603.5" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#4A5160" text-anchor="end" dominant-baseline="central">4.</text>
<text x="437" y="603.5" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#2A3240" text-anchor="start" dominant-baseline="central">Some styles are unique to individual brands and will not update automatically. These live below the shared Headings and Type styles.</text>
