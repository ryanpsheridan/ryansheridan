<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img">
<style>
.ring{animation:ring 16s cubic-bezier(.4,0,.2,1) infinite}
.acc{animation:acc 16s ease-in-out infinite}
@keyframes ring{0%,21%{transform:translateX(0)}25%,46%{transform:translateX(196px)}50%,71%{transform:translateX(392px)}75%,96%{transform:translateX(588px)}100%{transform:translateX(0)}}
@keyframes acc{0%,21%{fill:#2F6BE3}25%,46%{fill:#5B4BE0}50%,71%{fill:#2E5BFF}75%,96%{fill:#2149D3}100%{fill:#2F6BE3}}
@media (prefers-reduced-motion:reduce){.ring,.acc{animation:none}.acc{fill:#5B4BE0}}
</style>
