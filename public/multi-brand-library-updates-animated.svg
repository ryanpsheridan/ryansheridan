<text x="414" y="899" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16.5" font-weight="600" fill="#101828" text-anchor="start" dominant-baseline="central">Using colors</text>
<text x="430" y="948" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#4A5160" text-anchor="end" dominant-baseline="central">1.</text>
<text x="437" y="948" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#2A3240" text-anchor="start" dominant-baseline="central">All brand colors are now in one file. You no longer need to switch between brand library dropdowns to access colors.</text>
<text x="430" y="970" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#4A5160" text-anchor="end" dominant-baseline="central">2.</text>
<text x="437" y="970" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#2A3240" text-anchor="start" dominant-baseline="central">Brand tokens will appear first in the color picker, followed by raw primitive colors. To filter to a specific brand's palette,</text>
<text x="437" y="990" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#2A3240" text-anchor="start" dominant-baseline="central">type “fdx”, “cm”, or “bc” in the color picker search.</text>
